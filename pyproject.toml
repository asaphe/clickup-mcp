[project]
name = "clickup-mcp-server"
version = "0.1.0"
description = "MCP server for ClickUp task management"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-httpx>=0.35.0",
    "mypy>=2.3.1",
    "deptry>=0.25.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# pin the two families 0.15/0.16 disagree on, so both versions enforce the same
# set: 0.16 dropped 18 E/F rules from its defaults (astral-sh/ruff#27199) and added I
extend-select = ["E4", "E7", "E9", "F", "I"]
ignore = ["PLR2004", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]

[project.scripts]
clickup-mcp-server = "clickup_mcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
